server {
    listen 80;
    server_name thenomoreblocks.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name thenomoreblocks.com;

    ssl_certificate /etc/letsencrypt/live/thenomoreblocks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thenomoreblocks.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    http2 on;

    client_max_body_size 50M;

    location /x7kP9mQ/ {
        proxy_pass http://3xui:8383/x7kP9mQ/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_redirect off;
    }
}
