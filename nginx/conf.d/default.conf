server {
  listen 443 ssl;
  http2 on;
  server_name thenomoreblocks.com;

  ssl_certificate /etc/letsencrypt/live/thenomoreblocks.com/fullchain.pem; 
  ssl_certificate_key /etc/letsencrypt/live/thenomoreblocks.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; worker-src 'self' blob:" always;  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  client_max_body_size 10M;

  limit_req zone=addr_req burst=20 nodelay;
  limit_conn addr 50;

  location / {
    root /var/www/frontend;
    try_files $uri /index.html;
  }

  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}

server {
  listen 80;
  server_name thenomoreblocks.com;
  return 301 https://$host$request_uri;
}
