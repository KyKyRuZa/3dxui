services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/www:/var/www/html:ro
      - frontend-dist:/var/www/frontend:ro
      - ./nginx/logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - vpn-net
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      - PORT=8080
      - BOT_API_SECRET=${BOT_API_SECRET}
      - PANEL_URL=${PANEL_URL}
      - PANEL_USERNAME=${PANEL_USERNAME}
      - PANEL_PASSWORD=${PANEL_PASSWORD}
      - PANEL_API_TOKEN=${PANEL_API_TOKEN}
      - DEFAULT_SUBSCRIPTION_DAYS=${DEFAULT_SUBSCRIPTION_DAYS}
      - DEFAULT_INBOUND_IDS=${DEFAULT_INBOUND_IDS}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
      - BOT_TOKEN=${BOT_TOKEN}
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vpn-net
    restart: unless-stopped
    user: "1000:1000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      - NODE_ENV=production
    volumes:
      - frontend-dist:/app/dist
    networks:
      - vpn-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -d /app/dist && test -f /app/dist/index.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    build: ./bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - WEB_APP_URL=${WEB_APP_URL}
      - BACKEND_URL=http://backend:8080
      - BOT_API_SECRET=${BOT_API_SECRET}
      - NOTIFY_INTERVAL=${NOTIFY_INTERVAL}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vpn-net
    user: "1000:1000"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis-data:/data
      - ./backend/config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn-net
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  frontend-dist:

networks:
  vpn-net:
    driver: bridge
