services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:v3.6.0
    container_name: 3xui
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./db:/etc/x-ui/
      - ./cert:/root/cert/
      - ./acme:/root/.acme.sh/
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      XUI_PORT: "8383"
      XUI_INIT_WEB_BASE_PATH: "/x7kP9mQ/"
    tty: true
    restart: unless-stopped
    ports:
      - "8383:8383"
      - "8443:8443"
      - "2096:2096"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_API_SECRET: ${BOT_API_SECRET}
      APP_ENV: ${APP_ENV:-production}
      CORS_DOMAIN: ${CORS_DOMAIN}
      PANEL_URL: ${PANEL_URL}
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL}
      PANEL_USERNAME: ${PANEL_USERNAME}
      PANEL_PASSWORD: ${PANEL_PASSWORD}
      PANEL_API_TOKEN: ${PANEL_API_TOKEN}
      DEFAULT_GROUP: ${DEFAULT_GROUP:-Free}
      DEFAULT_INBOUND_IDS: ${DEFAULT_INBOUND_IDS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - frontend_dist:/app/dist
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - frontend_dist:/var/www/frontend
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_API_SECRET: ${BOT_API_SECRET}
      BACKEND_URL: http://backend:8080
      WEB_APP_URL: ${WEB_APP_URL}
      NOTIFY_INTERVAL: ${NOTIFY_INTERVAL:-3600}
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  frontend_dist:
