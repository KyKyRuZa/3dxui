services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:v3.6.0
    container_name: 3xui
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./db:/etc/x-ui/
      - ./cert:/root/cert/
      - ./acme:/root/.acme.sh/
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      XUI_PORT: "8383"
      XUI_INIT_WEB_BASE_PATH: "/x7kP9mQ/"
    tty: true
    restart: unless-stopped
    ports:
      - "8383:8383"
      - "443:443"
      - "2096:2096"
